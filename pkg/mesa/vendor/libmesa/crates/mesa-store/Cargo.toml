[package]
name = "mesa-store"
description = "Reference transactional SQLite host for bounded libmesa flows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
mesa-core = { path = "../mesa-core" }
mesa-flow = { path = "../mesa-flow" }
mesa-crypto = { path = "../mesa-crypto" }
mesa-transport = { path = "../mesa-transport" }
rusqlite = { version = "0.40.2", features = ["bundled", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
