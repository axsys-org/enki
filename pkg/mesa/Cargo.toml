[package]
name = "enki-mesa"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# libmesa at one commit. Change the commit of each line together.
mesa-noun = { git = "https://github.com/gwbtc/libmesa", rev = "c3d34bf473f1912a575243783e399b2001f4a658" }
mesa-wire = { git = "https://github.com/gwbtc/libmesa", rev = "c3d34bf473f1912a575243783e399b2001f4a658" }
mesa-crypto = { git = "https://github.com/gwbtc/libmesa", rev = "c3d34bf473f1912a575243783e399b2001f4a658" }
mesa-identity = { git = "https://github.com/gwbtc/libmesa", rev = "c3d34bf473f1912a575243783e399b2001f4a658" }
mesa-lss = { git = "https://github.com/gwbtc/libmesa", rev = "c3d34bf473f1912a575243783e399b2001f4a658" }
mesa-core = { git = "https://github.com/gwbtc/libmesa", rev = "c3d34bf473f1912a575243783e399b2001f4a658" }
mesa-flow = { git = "https://github.com/gwbtc/libmesa", rev = "c3d34bf473f1912a575243783e399b2001f4a658" }
mesa-transport = { git = "https://github.com/gwbtc/libmesa", rev = "c3d34bf473f1912a575243783e399b2001f4a658" }
mesa-udp = { git = "https://github.com/gwbtc/libmesa", rev = "c3d34bf473f1912a575243783e399b2001f4a658" }
mesa-store = { git = "https://github.com/gwbtc/libmesa", rev = "c3d34bf473f1912a575243783e399b2001f4a658" }
serde_json = { version = "1", features = ["arbitrary_precision"] }
zeroize = "1.9"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
